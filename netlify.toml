# ŠTOK I KRILO — Netlify konfiguracija
# Sajt je statican (index.html u rootu). Build komanda namerno prazna.

[build]
  command = ""
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/odobri"
  to = "/.netlify/functions/odobri"
  status = 200

[[redirects]]
  from = "/odobri-firmu"
  to = "/.netlify/functions/odobri-firmu"
  status = 200

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[redirects]]
  from = "/api/drafts"
  to = "/.netlify/functions/drafts"
  status = 200

[[redirects]]
  from = "/api/prijave"
  to = "/.netlify/functions/prijave"
  status = 200

[[redirects]]
  from = "/api/cene"
  to = "/.netlify/functions/cene"
  status = 200

[[redirects]]
  from = "/api/kompanije"
  to = "/.netlify/functions/kompanije"
  status = 200

[[redirects]]
  from = "/api/firme"
  to = "/.netlify/functions/firme"
  status = 200

[[redirects]]
  from = "/api/tenders"
  to = "/.netlify/functions/tenders"
  status = 200

[[redirects]]
  from = "/api/tenders-import"
  to = "/.netlify/functions/tenders-import"
  status = 200

# Svaka strana portala ima svoju adresu. Netlifaj ih sve servira kao
# index.html, a JavaScript iz putanje otvara pravu stranu. Putanje su
# nabrojane poimence, da slučajno ne pokupe /api/*, /odobri ili admin.html.

[[redirects]]
  from = "/vesti"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cene"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/barometar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kompanije"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/edukacija"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sajmovi"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tenderi"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/analize"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/alati"
  to = "/index.html"
  status = 200
